version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ilpi-db-dev
    environment:
      POSTGRES_USER: ilpi
      POSTGRES_PASSWORD: ilpi_dev_password
      POSTGRES_DB: ilpi
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilpi -d ilpi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ilpi-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ilpi-backend-dev
    volumes:
      - ./backend:/app
      - /app/.venv  # Prevent venv conflicts on Windows/Mac
    environment:
      DATABASE_URL: postgresql://ilpi:ilpi_dev_password@db:5432/ilpi
      SECRET_KEY: dev-secret-key-change-in-production-min32chars
      CORS_ORIGINS: http://localhost
      LOG_LEVEL: DEBUG
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ilpi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ilpi-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Magic volume: shadows host node_modules with container's installed ones
    environment:
      VITE_API_URL: /api/v1
    networks:
      - ilpi-network

  gateway:
    image: nginx:alpine
    container_name: ilpi-gateway-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ilpi-network

volumes:
  postgres_dev_data:

networks:
  ilpi-network:
    driver: bridge
