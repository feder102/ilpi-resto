# Production stack for a single VPS (e.g. Hetzner), fronted by Caddy with
# automatic HTTPS. Frontend and backend are served from the SAME domain, so
# there are no CORS/cookie cross-site issues.
#
# Usage:
#   cp .env.prod.example .env   # then edit values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# First deploy only (create the ILPI tenant + admin user, then CHANGE the password):
#   docker compose -f docker-compose.prod.yml exec backend python -m app.seed

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ilpi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ilpi} -d ${POSTGRES_DB:-ilpi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port: the DB is only reachable on the internal Docker network.

  backend:
    build: ./backend
    restart: unless-stopped
    # Prod command: apply migrations, then run uvicorn WITHOUT --reload and WITHOUT seed.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ilpi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ilpi}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: "true"   # served over HTTPS
      COOKIE_SAMESITE: "lax"  # same-origin (front+back under one domain)
      DISABLE_SCHEDULER: "false"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api/v1   # relative -> proxied to backend by Caddy
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Admin-only documentation site (issue #30). Build the template-documentacion
      # project (Vite base '/docum/') and copy its dist/ into ./docum-dist.
      - ./docum-dist:/srv/docum:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
