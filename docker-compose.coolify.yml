# Production stack for Coolify (Docker Compose build pack).
#
# Coolify's Traefik proxy terminates TLS and routes the domain to the `gateway`
# service (port 80). The gateway (Caddy, plain HTTP) splits traffic under ONE
# domain, so there are no CORS/cookie cross-site issues:
#   /api/*, /health, /docs  -> backend
#   /docum*                 -> static docs site (admin-only, forward_auth)
#   everything else         -> frontend SPA
#
# Coolify setup:
#   - Build pack: Docker Compose, compose file: /docker-compose.coolify.yml
#   - Domain on the `gateway` service: https://<host>:80
#   - Environment variables: DOMAIN (+ optional Mailjet). The DB password and
#     SECRET_KEY are generated by Coolify (magic SERVICE_PASSWORD_* variables).
#
# First deploy only (fresh database): run `python -m app.seed` in the backend
# container to create the ILPI tenant + admin user, then CHANGE the password.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilpi}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-ilpi}
    volumes:
      - ilpi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ilpi} -d ${POSTGRES_DB:-ilpi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # Apply migrations, then run uvicorn WITHOUT --reload and WITHOUT seed.
    # --proxy-headers makes request.client the real visitor IP (rate limiting,
    # audit logs) instead of the gateway's.
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips='*'"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ilpi}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-ilpi}
      SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEY}
      CORS_ORIGINS: https://${DOMAIN:?DOMAIN is required}
      COOKIE_SECURE: "true"   # served over HTTPS (TLS at Coolify's proxy)
      COOKIE_SAMESITE: "lax"  # same-origin (front+back under one domain)
      DISABLE_SCHEDULER: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
      MAILJET_SENDER_NAME: ${MAILJET_SENDER_NAME:-ILPI}
      MAILJET_SENDER_EMAIL: ${MAILJET_SENDER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api/v1   # relative -> proxied to backend by the gateway
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    build: ./gateway
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ilpi-caddy-data:/data
      # Admin-only documentation site (issue #30): copy the template-documentacion
      # dist/ into ./docum-dist on the server (Coolify app directory).
      - ./docum-dist:/srv/docum:ro
    depends_on:
      - backend
      - frontend

volumes:
  ilpi-pgdata:
  ilpi-caddy-data:
