version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ilpi
      POSTGRES_PASSWORD: ilpi_dev_password
      POSTGRES_DB: ilpi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ilpi:ilpi_dev_password@db:5432/ilpi
      SECRET_KEY: dev-secret-key-change-in-production-min32chars
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: INFO
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
